name: Bug report
description: Report a reproducible problem in YTDugem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md for private reporting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reproduce the problem.
      placeholder: |
        1. Open YTDugem
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: YTDugem version or commit
      description: Shown in the release name, or the commit hash you built from.
      placeholder: "e.g. v0.1.0 or 3957d10"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Portable ZIP (YTDugem-windows-x86_64.zip)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or playback report
      description: Paste relevant log output. Remove any cookies, tokens or API keys first.
      render: shell

  - type: checkboxes
    id: redaction
    attributes:
      label: Privacy
      options:
        - label: I removed cookies, tokens, API keys and other secrets from everything I pasted or attached.
          required: true
